<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased}
body{display:block!important}body>div{width:100%}
.wrap{padding:8px 4px;display:flex;flex-direction:column;gap:18px}
.label{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.02em;color:#696970}
.label::after{content:"";flex:1;height:1px;background:#E5E5E5}

/* head */
.head{display:flex;justify-content:center}
.pill{background:#0672CB;color:#fff;padding:12px 28px 13px;border-radius:22px;text-align:center;opacity:0;transform:translateY(-6px);animation:in .45s ease forwards}
.pill b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.pill span{display:block;margin-top:3px;font-size:12px;font-weight:450;line-height:1.2;color:#D9EAF9}
.stem{width:2px;height:20px;background:#D5D7DB;margin:0 auto;transform-origin:top;transform:scaleY(0);animation:grow .3s ease .35s forwards;transition:background .25s}
.lit .stem{background:#0672CB}

/* rail */
.rail{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;height:44px}
.branch{position:relative;opacity:0;animation:fade .3s ease forwards}
.branch::before{content:"";position:absolute;top:6px;left:-12px;right:-12px;height:2px;background:#D5D7DB}
.branch:first-child::before{left:calc(50% - 1px)}
.branch:nth-child(5)::before{right:calc(50% - 1px)}
.branch::after{content:"";position:absolute;top:6px;left:calc(50% - 1px);width:2px;height:38px;background:#D5D7DB;transition:background .25s}
.branch.on::after{background:#0672CB}
.dot{position:absolute;top:0;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #B9D7EF;z-index:2;transition:border-color .25s,transform .25s}
.branch.on .dot{border-color:#0672CB;transform:scale(1.18)}
.trace{position:absolute;top:6px;height:2px;background:#0672CB;z-index:1;opacity:0;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1),opacity .2s}
.trace.show{opacity:1}
.branch:nth-child(1){animation-delay:.50s}.branch:nth-child(2){animation-delay:.56s}.branch:nth-child(3){animation-delay:.62s}.branch:nth-child(4){animation-delay:.68s}.branch:nth-child(5){animation-delay:.74s}

/* cards */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:#fff;border:1px solid #E5E5E5;border-radius:18px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;opacity:0;transform:translateY(8px);animation:in .45s ease forwards;transition:border-color .25s,box-shadow .25s,transform .25s}
.card:nth-child(1){animation-delay:.58s}.card:nth-child(2){animation-delay:.64s}.card:nth-child(3){animation-delay:.70s}.card:nth-child(4){animation-delay:.76s}.card:nth-child(5){animation-delay:.82s}
.card.on{border-color:#0672CB;box-shadow:0 4px 16px rgba(6,114,203,.13);transform:translateY(-3px)}
.card:focus-visible{outline:2px solid #0672CB;outline-offset:2px}
.card h4{font-size:15px;font-weight:600;line-height:1.25;transition:color .25s}
.card.on h4{color:#0672CB}
.card p{font-size:12.5px;line-height:1.5;color:#696970}

@keyframes in{to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes fade{to{opacity:1}}

@media (max-width:760px){
  .rail{display:none}
  .flow{grid-template-columns:1fr;gap:0}
  .card{position:relative;margin-top:14px}
  .card::before{content:"";position:absolute;top:-15px;left:calc(50% - 1px);width:2px;height:14px;background:#D5D7DB;transition:background .25s}
  .card.on::before{background:#0672CB}
  .card:first-child{margin-top:0}
  .card:first-child::before{display:none}
  .card.on{transform:none}
}
@media (max-width:440px){.wrap{gap:12px}.card{padding:13px 12px 14px}}
@media (prefers-reduced-motion:reduce){
  .pill,.card,.branch,.stem{animation:none!important;opacity:1!important;transform:none!important}
  .trace,.dot,.card,.stem,.branch::after{transition:none!important}
  .card.on{transform:none}
}
@media (min-width:900px){body{min-height:384px}}
</style></head><body>
<div class="wrap" id="wrap">
  <div class="label">Streamliner · What the platform is made of</div>

  <div class="head"><div class="pill"><b>Streamliner</b><span>One platform, five modules</span></div></div>
  <div class="stem"></div>
  <div class="rail" id="rail">
    <div class="branch"><div class="dot"></div></div>
    <div class="branch"><div class="dot"></div></div>
    <div class="branch"><div class="dot"></div></div>
    <div class="branch"><div class="dot"></div></div>
    <div class="branch"><div class="dot"></div></div>
    <div class="trace" id="trace"></div>
  </div>

  <div class="flow" id="flow">
    <button class="card" type="button"><h4>Create &amp; Edit</h4><p>Captures Credit, Return, and Exchange requests, pulls order and product details, and validates policy rules into a standard CRE case.</p></button>
    <button class="card" type="button"><h4>Verify &amp; Review</h4><p>Checks eligibility and applies business policies to approve, reject, or flag a request for review.</p></button>
    <button class="card" type="button"><h4>Return Method</h4><p>Selects the right logistics method and generates shipping instructions for the return or exchange.</p></button>
    <button class="card" type="button"><h4>Process &amp; Track</h4><p>Runs return operations across enterprise systems with status visibility and a full CRE history.</p></button>
    <button class="card" type="button"><h4>Disposition &amp; Recovery</h4><p>Handles inspection outcomes, refunds, replacements, and inventory recovery after the item arrives.</p></button>
  </div>
</div>
<script>
(function(){
  var wrap=document.getElementById('wrap'),rail=document.getElementById('rail'),trace=document.getElementById('trace');
  var branches=[].slice.call(rail.querySelectorAll('.branch'));
  var cards=[].slice.call(document.getElementById('flow').children);
  var ORIGIN=2;                                  // the stem meets the rail at the middle dot
  function centre(i){
    var r=rail.getBoundingClientRect(),d=branches[i].querySelector('.dot').getBoundingClientRect();
    return d.left-r.left+d.width/2;
  }
  function clear(){
    trace.className='trace';
    branches.forEach(function(b){b.classList.remove('on')});
    cards.forEach(function(c){c.classList.remove('on')});
    wrap.classList.remove('lit');
  }
  function show(i){
    clear();
    cards[i].classList.add('on');
    branches[i].classList.add('on');
    wrap.classList.add('lit');
    var a=centre(ORIGIN),b=centre(i);
    trace.style.left=Math.min(a,b)+'px';
    trace.style.width=Math.abs(b-a)+'px';
    trace.classList.add('show');
  }
  cards.forEach(function(c,i){
    c.addEventListener('mouseenter',function(){show(i)});
    c.addEventListener('focus',function(){show(i)});
    c.addEventListener('mouseleave',clear);
    c.addEventListener('blur',clear);
    c.addEventListener('click',function(){show(i)});
  });
  window.addEventListener('resize',clear);
})();
</script>
</body></html>
