ils','Ready to ship','','tag'],   ['otm','Updating waybill details','Waybill ready','Waybill','tag'],   ['log','Scheduling the pickup','Pickup booked','','box'],   ['cust','Courier collects the faulty unit','Package handed over','Picked up','box'],   ['log','Package in transit','Delivered to facility','','box'],   ['arb','Item dropped at the ARB facility','Item received','','box'],   ['dr','Inspecting the item, forwarding details to P&T','Inspection passed','Inspected','ok'],   ['pt','Approving the replacement','Replacement approved','','ok'],   ['delta','Creating the replacement order in Delta / RIMS','Order created','Reordered','gift'],   ['pt','Tracking the replacement','Tracking started','','gift'],   ['rm','Setting up the delivery','Delivery method set','','gift'],   ['otm','Creating the delivery waybill','Waybill ready','','gift'],   ['log','Shipping the replacement','Out for delivery','Shipped','gift'],   ['cust','Replacement reaches the customer','Delivered','Delivered','gift']] };
const edgeOf=(a,b)=>E[a+'-'+b]?[a+'-'+b,0]:E[b+'-'+a]?[b+'-'+a,1]:null;
const ORDER=['credit','return','exchange'];
const PICKS=[['credit','Credit'],['return','Return'],['exchange','Exchange']];
const SPEED=104,WORK_KEY=3.1,WORK=2.5,HOLD=1.5,END=3.6;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
$('pick').insertAdjacentHTML('beforeend',PICKS.map(p=>`<button class="opt" data-k="${p[0]}" role="tab"><i></i>${p[1]}</button>`).join(''));
let cur,seq,i,phase,t,dur,paused=false,path=null,pathL=0,lastNow=0,dash=0,tokSc=1,tokPt=[0,0];
function movePill(){const b=document.querySelector('.opt.on');if(!b)return;
 const p=$('pill');p.style.width=b.offsetWidth+'px';p.style.height=b.offsetHeight+'px';p.style.transform=`translateX(${b.offsetLeft-4}px) translateY(${b.offsetTop-4}px)`}
function milestones(){return seq.map((s,j)=>({s,j})).filter(o=>o.s[3])}
function renderSteps(){$('steps').innerHTML=milestones().map((o,k)=>`${k?'<span class="sep" data-j="'+o.j+'"></span>':''}<span class="s" data-j="${o.j}"><span class="dot"></span><span class="lb">${o.s[3]}</span></span>`).join('')}
function markSteps(){const fin=j=>j<i||(j===i&&(phase==='done'||phase==='end'));
 const col=CO(seq[i][0]);
 $('steps').querySelectorAll('.s').forEach(el=>{const j=+el.dataset.j,d=fin(j),now=!d&&j===i&&(phase==='work'||phase==='move'||phase==='land');
  el.classList.toggle('done',d);el.classList.toggle('now',now);el.style.background=now?col:''});
 $('steps').querySelectorAll('.sep').forEach(el=>el.classList.toggle('done',fin(+el.dataset.j)))}
function setStatus(kind){const s=seq[i],id=s[0],col=CO(id);
 $('apl').textContent=N[id].k==='p'?'Actor':'Application';$('ap').textContent=NAME[id];
 $('apn').style.color=col;
 $('ac').textContent=kind==='work'?s[1]:kind==='done'?s[2]:`Handing over to ${NAME[id]}`}
function focusRoute(){const ue=new Set(),un=new Set(seq.map(s=>s[0]));
 for(let j=1;j<seq.length;j++)ue.add(edgeOf(seq[j-1][0],seq[j][0])[0]);
 for(const k in EL){const u=ue.has(k);EL[k].setAttribute('stroke',u?'#C6C8CD':'#ECECEF');EL[k].setAttribute('stroke-dasharray',u?'':'3 6')}
 for(const id in G)G[id].style.opacity=un.has(id)?1:.34}
function placeTok(pt){tokPt=pt;tok.setAttribute('transform',`translate(${pt[0]},${pt[1]}) scale(${tokSc})`);halo.setAttribute('cx',pt[0]);halo.setAttribute('cy',pt[1])}
function showTok(v){tokSc=1;placeTok(tokPt);tok.setAttribute('opacity',v?1:0);if(!v)halo.setAttribute('opacity',0)}
function start(k){cur=k;seq=F[k];i=0;trail.innerHTML='';flow.innerHTML='';
 document.querySelectorAll('.opt').forEach(b=>{const on=b.dataset.k===k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
 movePill();
 for(const id in N)nodeState(id,'idle');focusRoute();renderSteps();
 tokIcon.innerHTML=ICON[seq[0][4]];placeTok([N.cust.x,N.cust.y]);showTok(false);
 phase='work';t=0;dur=WORK;nodeState('cust','work',0);setStatus('work');markSteps()}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function next(){if(i>=seq.length-1){phase='end';t=0;dur=END;markSteps();return}
 const [ek,rev]=edgeOf(seq[i][0],seq[i+1][0]),a=N[seq[i][0]],b=N[seq[i+1][0]];
 const pts=[[a.x,a.y],...(rev?E[ek].slice().reverse():E[ek]),[b.x,b.y]],d=rpath(pts,HOPS[ek]);
 const col=CO(seq[i+1][0]);
 path=mk('path',{d,fill:'none',stroke:col,'stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'},trail);
 flow.innerHTML='';mk('path',{d,fill:'none',stroke:col,'stroke-width':2.6,'stroke-linecap':'round',opacity:.35,'stroke-dasharray':'1 13'},flow);
 tokBg.setAttribute('fill',col);halo.setAttribute('fill',col);
 pathL=path.getTotalLength();path.style.strokeDasharray=`${pathL} ${pathL}`;path.style.strokeDashoffset=pathL;
 i++;phase='move';t=0;dur=reduce?.01:Math.max(1.5,pathL/SPEED);
 tokIcon.innerHTML=ICON[seq[i][4]];placeTok(pts[0]);showTok(true);setStatus('move');markSteps()}
function frame(now){const dt=Math.min(.05,(now-(lastNow||now))/1000);lastNow=now;
 for(const id in N){const n=N[id];
  if(reduce){n.sc=n.target}
  else{const k=150,c=2*Math.sqrt(k)*.78;n.vel+=((n.target-n.sc)*k-n.vel*c)*dt;n.sc+=n.vel*dt}
  if(Math.abs(n.sc-1)>0.0015){const cx=n.x,cy=n.y;GI[id].setAttribute('transform',`translate(${cx},${cy}) scale(${n.sc.toFixed(4)}) translate(${-cx},${-cy})`)}
  else GI[id].removeAttribute('transform')}
 if(!paused&&seq){t+=dt;const p=Math.min(1,t/dur),id=seq[i][0];
  if(phase==='move'){const d=pathL*ease(p),q=path.getPointAtLength(d);placeTok([q.x,q.y]);path.style.strokeDashoffset=pathL-d;
   dash=(dash-dt*46)%14;flow.firstChild&&flow.firstChild.setAttribute('stroke-dashoffset',dash);
   halo.setAttribute('opacity',(.14*Math.sin(t*6)+.16).toFixed(3));
   halo.setAttribute('r',(20+3*Math.sin(t*6)).toFixed(2));
   if(p>=1){phase='land';t=0;dur=reduce?.01:.3;N[id].target=1.3;tok.setAttribute('opacity',1)}}
  else if(phase==='land'){const u=p;
   tokSc=Math.max(0,u<.32?1+.34*(u/.32):1.34*(1-ease((u-.32)/.68)));placeTok(tokPt);
   tok.setAttribute('opacity',u<.58?1:Math.max(0,1-(u-.58)/.42).toFixed(3));
   halo.setAttribute('opacity',(.3*(1-u)).toFixed(3));halo.setAttribute('r',(12+26*u).toFixed(1));
   if(p>=1){showTok(false);phase='work';t=0;dur=seq[i][3]?WORK_KEY:WORK;nodeState(id,'work',0);setStatus('work');markSteps()}}
  else if(phase==='work'){nodeState(id,'work',p);const n=N[id],ph=(t%1.35)/1.35;
   halo.setAttribute('opacity',0);
   n.ring.setAttribute('opacity',reduce?.5:(.5*(1-ph)).toFixed(3));
   if(!reduce){const w=n.r?n.r*2:n.w,h=n.r?n.r*2:n.h,g=7+ph*10;
    if(n.r)n.ring.setAttribute('r',n.r+g);
    else{n.ring.setAttribute('x',n.x-w/2-g);n.ring.setAttribute('y',n.y-h/2-g);n.ring.setAttribute('width',w+2*g);n.ring.setAttribute('height',h+2*g);n.ring.setAttribute('rx',(n.ch?17:11)+g)}}
   if(p>=1){phase='done';t=0;dur=HOLD;nodeState(id,'done');
    if(path){path.setAttribute('stroke','#C6C8CD');path.setAttribute('stroke-width',2)}
    flow.innerHTML='';setStatus('done');markSteps()}}
  else if(phase==='done'){if(p>=1)next()}
  else if(phase==='end'){if(p>=1)start(ORDER[(ORDER.indexOf(cur)+1)%3])}}
 requestAnimationFrame(frame)}
$('pick').onclick=e=>{const b=e.target.closest('.opt');if(b)start(b.dataset.k)};
addEventListener('resize',()=>{movePill()});
document.addEventListener('visibilitychange',()=>{paused=document.hidden});
start('credit');requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(movePill);
 if(window.ResizeObserver)new ResizeObserver(movePill).observe($('pick')); </script></body></html>
