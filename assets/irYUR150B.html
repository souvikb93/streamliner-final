html,body{width:100%}body{display:block!important}body>div{width:100%} *{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased} .list{display:flex;flex-direction:column;gap:12px;padding:4px} .row{display:grid;grid-template-columns:44px 1.15fr 1fr 1fr;gap:18px;align-items:start;background:#fff;border:1px solid #E5E5E5;border-radius:20px;padding:18px} .num{font-size:13px;font-weight:600;color:#0063B8;background:#C8E3F7;border-radius:10px;height:34px;display:flex;align-items:center;justify-content:center} h4{font-size:15px;font-weight:600;margin-bottom:10px} .opts{display:flex;flex-direction:column;gap:6px} .opt{font-size:12.5px;padding:7px 10px;border-radius:8px;background:#F0F1F4;color:#696970;display:flex;gap:8px;align-items:center} .opt::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid #A1A1AA;flex:none} .opt.pick{background:#0672CB;color:#fff;font-weight:500} .opt.pick::before{background:#fff;border-color:#fff} .col em{display:block;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.02em;color:#696970;margin-bottom:6px} .col p{font-size:13px;line-height:1.5;color:#121212} .col.t p{color:#A15C00} .col.t em{color:#A15C00} @media (max-width:820px){.row{grid-template-columns:1fr}}

@media (max-width:440px){.list{gap:10px}.row{padding:12px;gap:12px}}</style></head><body> <div class="list" id="list"></div> <script> const D=[  {t:"How global should the process be?",o:["One rigid global process","A separate tool per country","Shared core + local rule layer"],p:2,   w:"Research showed the differences between regions lived in rules, not in the flow itself. A shared core kept one experience; the rule layer kept each country workable.",   x:"More upfront modelling with the enterprise architects, and a slower first release than a copy-paste of one region's process."},  {t:"How much should we automate?",o:["Keep manual approvals","Automate every decision","Automate clear cases, route exceptions"],p:2,   w:"Most requests were routine, but policy exceptions and incomplete data still needed judgement. Full automation would have pushed errors onto customers.",   x:"Thresholds started conservative, so more requests reached agents in the early weeks until the rules earned trust."},  {t:"What should the agent tool be built around?",o:["Dashboard of volumes and trends","The individual case and its context"],p:1,   w:"Early explorations were dashboard-first. Testing with care agents showed they work one case at a time and need policy, margin and history beside the decision.",   x:"Two surfaces to maintain: the case view for agents and a separate dashboard for team leads."},  {t:"How should it roll out?",o:["Big-bang launch in all 17 countries","Proof of concept in one region first"],p:1,   w:"ANZ already had automated carrier integration and a manageable volume, so it could prove the framework quickly and produce real metrics.",   x:"Other regions waited longer, and ANZ was not representative of manual-carrier markets, so rules needed tuning before wider rollout."} ]; document.getElementById('list').innerHTML=D.map((d,i)=>`<div class="row"><div class="num">0${i+1}</div><div><h4>${d.t}</h4><div class="opts">${d.o.map((o,k)=>`<div class="opt ${k===d.p?'pick':''}">${o}</div>`).join('')}</div></div><div class="col"><em>Why we chose it</em><p>${d.w}</p></div><div class="col t"><em>What it cost us</em><p>${d.x}</p></div></div>`).join(''); </script> </body></html>
