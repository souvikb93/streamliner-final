<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
:root{--t-display:40px;--t-title-lg:24px;--t-title:18px;--t-body:14px;--t-caption:12px;--t-micro:10px;--r-surface:24px;--r-card:16px;--r-inner:12px;--r-node:8px;--r-xs:4px;--r-pill:999px}
@media (max-width:1023px){:root{--t-display:30px;--t-title-lg:18px;--t-title:16px}}
@media (max-width:767px){:root{--t-display:22px;--t-title-lg:16px;--t-title:15px}}

 html,body{width:100%}body{display:block!important}body>div{width:100%} *{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased} .label{font-size:var(--t-caption);font-weight:600;letter-spacing:.02em;color:#696970}  .wrap{padding:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px} .col{background:#fff;border:1px solid #E5E5E5;border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column} .hd{background:#0672CB;color:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:4px} .hd em{font-style:normal;font-size:var(--t-micro);font-weight:600;letter-spacing:.02em;color:#F2F8FD} .hd b{font-size:var(--t-title);font-weight:600;line-height:1.3} .bd{padding:16px 18px;display:flex;flex-direction:column;gap:10px;flex:1} .bd .label{font-size:var(--t-micro)} .mv{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:var(--r-inner);background:#F4F6FA} .mod{font-size:var(--t-micro);font-weight:600;color:#0063B8;background:#C8E3F7;border-radius:var(--r-node);padding:3px 7px;white-space:nowrap;margin-top:1px} .mv p{font-size:var(--t-caption);line-height:1.45;color:#121212} .ev{margin-top:auto;border-top:1px solid #E5E5E5;padding:14px 18px;display:flex;align-items:baseline;gap:10px} .ev b{font-size:var(--t-title-lg);font-weight:600;letter-spacing:-.02em;color:#1E8A4C;white-space:nowrap} .ev small{font-size:var(--t-caption);color:#696970;line-height:1.4} @media (max-width:820px){.wrap{grid-template-columns:1fr}} 
@media (min-width:900px){body{min-height:453px}}
@media (max-width:440px){.wrap{gap:12px}.hd{padding:12px 12px}.bd{padding:12px 12px}.mv{padding:10px 10px}.ev{padding:10px 12px}}</style></head><body> <div class="wrap" id="w"></div> <script> const C=[['Enable greater autonomy',[['Create & Edit','Customers start and edit returns on Dell.com; agents use the same form in Salesforce.'],['Verify & Review','Clear cases are auto-approved by the rule engine, no hand-off to finance.'],['All modules','One standard CRE case for credit, return and exchange.']],'16 → 5','steps to create a request'], ['Augment human decision-making',[['Create & Edit','Order, product and line data pulled from SODS and PDSL instead of re-typed.'],['Verify & Review','The review screen shows policy period, CRE history, price match and margin side by side.'],['Verify & Review','Only exceptions reach agents, each with the rule that flagged it.']],'2–3 min','from case creation to decision'], ['Establish clear, predictable communication',[['Process & Track','One status and CRE history for every case, shared by customer and agent.'],['Process & Track','Salesforce notifies customer and agent automatically at each milestone.'],['Disposition & Recovery','Regional rules set timelines and refund triggers before the case starts.']],'5x faster','135.5 h → 26.5 h per credit']]; document.getElementById('w').innerHTML=C.map((c,k)=>`<div class="col"><div class="hd"><em>Opportunity 0${k+1}</em><b>${c[0]}</b></div><div class="bd"><div class="label">What we designed</div>${c[1].map(m=>`<div class="mv"><span class="mod">${m[0]}</span><p>${m[1]}</p></div>`).join('')}</div><div class="ev"><b>${c[2]}</b><small>${c[3]}</small></div></div>`).join(''); </script></body></html>
