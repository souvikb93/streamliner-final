<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
:root{--t-display:40px;--t-title-lg:24px;--t-title:18px;--t-body:14px;--t-caption:12px;--t-micro:10px;--r-surface:24px;--r-card:16px;--r-inner:12px;--r-node:8px;--r-xs:4px;--r-pill:999px}
@media (max-width:1023px){:root{--t-display:30px;--t-title-lg:18px;--t-title:16px}}
@media (max-width:767px){:root{--t-display:22px;--t-title-lg:16px;--t-title:15px}}

 html,body{width:100%}body{display:block!important}body>div{width:100%} *{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased} .label{font-size:var(--t-caption);font-weight:600;letter-spacing:.02em;color:#696970}  .wrap{padding:4px;display:flex;flex-direction:column;gap:16px} .room{background:#F4F6FA;border:1px solid #E5E5E5;border-radius:var(--r-card);padding:16px 18px;display:flex;flex-direction:column;gap:10px} .chips{display:flex;flex-wrap:wrap;gap:8px} .chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #E5E5E5;border-radius:var(--r-pill);padding:6px 12px 6px 6px;font-size:var(--t-caption);font-weight:500;color:#454548} .chip i{width:22px;height:22px;border-radius:50%;background:#C8E3F7;color:#0063B8;font-style:normal;font-size:var(--t-micro);font-weight:600;display:grid;place-items:center} .ses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} .s{background:#fff;border:1px solid #E5E5E5;border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:10px} .n{display:flex;align-items:center;gap:10px} .n span{width:30px;height:30px;border-radius:var(--r-inner);background:#C8E3F7;color:#0063B8;font-size:var(--t-caption);font-weight:600;display:grid;place-items:center} .n b{font-size:var(--t-title);font-weight:600} .s p{font-size:var(--t-caption);line-height:1.5;color:#454548} .out{font-size:var(--t-caption);line-height:1.45;color:#0063B8;background:#F2F8FD;border:1px solid #C8E3F7;border-radius:var(--r-inner);padding:8px 10px;margin-top:auto} .out strong{font-weight:600} .dec{background:#fff;border:1px solid #E5E5E5;border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px} .dl{display:grid;grid-template-columns:repeat(5,1fr);gap:10px} .d{border-radius:var(--r-inner);background:#F2FAF5;border:1px solid #9ED9B0;padding:12px;display:flex;flex-direction:column;gap:6px} .d svg{width:16px;height:16px} .d b{font-size:var(--t-body);font-weight:600;line-height:1.3} .d small{font-size:var(--t-caption);color:#454548;line-height:1.4} .bridge{font-size:var(--t-body);color:#454548} .bridge b{color:#0063B8;font-weight:600} @media (max-width:820px){.ses,.dl{grid-template-columns:1fr}} 
@media (min-width:900px){body{min-height:565px}}
@media (max-width:440px){.wrap{gap:12px}.room{padding:12px 12px}.chip{padding:6px 10px 6px 6px}.ses{gap:12px}.s{padding:12px}.dec{padding:12px;gap:10px}.d{padding:10px}}</style></head><body> <div class="wrap">  <div class="room"><div class="label">Who was in the room</div><div class="chips" id="who"></div></div>  <div class="ses" id="ses"></div>  <div class="dec"><div class="label">What we decided together</div><div class="dl" id="dec"></div><div class="bridge">These decisions became the brief for <b>Streamliner</b>: five modules around one standard CRE case.</div></div> </div> <script> const W=[['EA','Dell enterprise architects'],['PM','Product managers'],['DV','Developers'],['SE','Sales executives'],['RC','Regional care leads'],['WD','Wipro design team']]; const S=[['Playback & reframe','We played back the journey map, findings and three insights, then turned each opportunity area into How-might-we questions the group voted on.','Prioritised HMWs per opportunity area'],['Concept sprint','Mixed teams sketched the request lifecycle end to end and grouped ideas by stage until five modules emerged.','Five-module lifecycle, from Create & Edit to Disposition & Recovery'],['Feasibility & rules','With the architects we tested each concept against Salesforce, SODS, OMEGA and carrier integrations, and drafted the first verification rules.','Rule set for Verify & Review and a list of integrations per region']]; const D=[['Shared core, regional rules','One process for every country; local rules sit in a layer on top.'],['Five modules, one case','Credit, return and exchange share one standard CRE case.'],['Automate clear cases','Rules approve or reject routine requests; exceptions go to agents.'],['Rules owned with architects','V&R rules are defined and maintained with enterprise architecture.'],['ANZ proof of concept first','Prove the framework in one region before a wider rollout.']]; document.getElementById('who').innerHTML=W.map(w=>`<span class="chip"><i>${w[0]}</i>${w[1]}</span>`).join(''); document.getElementById('ses').innerHTML=S.map((s,k)=>`<div class="s"><div class="n"><span>0${k+1}</span><b>${s[0]}</b></div><p>${s[1]}</p><div class="out"><strong>Output:</strong> ${s[2]}</div></div>`).join(''); document.getElementById('dec').innerHTML=D.map(d=>`<div class="d"><svg viewBox="0 0 24 24" fill="none" stroke="#1E8A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg><b>${d[0]}</b><small>${d[1]}</small></div>`).join(''); </script></body></html>
