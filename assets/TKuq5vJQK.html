<!DOCTYPE html> <html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <script src="https://cdn.jsdelivr.net/npm/d3@7"></script> <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script> <style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
html,body{width:100%;height:488px;overflow:hidden}body{display:block!important}body>div{width:100%} *{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased} .wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:4px;height:480px} .mapbox{position:relative;background:#F4F6FA;border-radius:20px;overflow:hidden;height:100%;min-height:0} svg{width:100%;height:100%;display:block} .land{fill:#EDEFF3;stroke:#fff;stroke-width:.5;transition:fill .45s cubic-bezier(.4,0,.2,1)} .land.hit{cursor:pointer} .land.on{transition:fill .3s} .pin{stroke:#fff;stroke-width:1.5;transition:r .35s cubic-bezier(.4,0,.2,1),fill .4s cubic-bezier(.4,0,.2,1)} .pulse{fill:none;stroke-width:1.5;opacity:.6;animation:pulse 2.4s ease-out infinite} @keyframes pulse{0%{r:5;opacity:.7}100%{r:16;opacity:0}} .stat{position:absolute;left:16px;bottom:14px;display:flex;gap:18px} .stat div{display:flex;flex-direction:column} .stat b{font-size:22px;font-weight:700;color:#0063B8;line-height:1} .stat span{font-size:11px;color:#696970;margin-top:3px} .side{display:flex;flex-direction:column;height:100%;min-height:0} .card>.ch,.card>.facts,.card>.insight{transition:opacity .3s ease} .card.sw>.ch,.card.sw>.facts,.card.sw>.insight{opacity:.35} .card{flex:1;display:flex;flex-direction:column;background:#fff;border:1.5px solid #C8E3F7;border-radius:16px;padding:18px;gap:12px;height:100%;min-height:0;overflow:hidden} .ch{display:flex;flex-direction:column;gap:4px;flex:none;height:62px;overflow:hidden} .cht{display:flex;align-items:center;gap:8px;min-width:0} .ch p{font-size:12px;color:#696970;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .ch i{width:10px;height:10px;border-radius:50%;flex:none;transition:background .35s ease} .ch h4{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}  .facts{display:flex;flex-direction:column;border-top:1px solid #E5E5E5;flex:none} .f{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;height:34px;border-bottom:1px solid #F0F1F4} .f:last-child{border-bottom:1px solid #E5E5E5} .f em{font-style:normal;font-size:11px;font-weight:500;color:#696970;line-height:1.4} .f b{font-size:13px;font-weight:600;line-height:1.45;color:#121212;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .f b.num{font-size:15px;font-weight:700;color:#0063B8} .insight{display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:3px solid #C8E3F7;transition:border-color .4s ease;flex:1;min-height:0;overflow:hidden} .insight em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.02em;color:#696970} .insight strong{font-size:13px;font-weight:600;line-height:1.4;color:#121212} .insight p{font-size:12.5px;line-height:1.5;color:#696970;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden} .dots{display:flex;gap:6px;flex:none;padding-top:4px} .dot{position:relative;width:100%;height:4px;border-radius:999px;border:0;padding:0;background:#E5E5E5;cursor:pointer;transition:background .3s ease} .dot::before{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px} .dot.on{background:#0672CB} .dot:focus-visible{outline:2px solid #0672CB;outline-offset:2px} @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}.land,.pin,.card>.ch,.card>.facts,.card>.insight{transition:none}} @media (max-width:820px){html,body{height:auto;overflow:visible}.wrap{grid-template-columns:1fr;height:auto}.mapbox{height:340px}.side{height:auto}.card{height:auto}.insight{flex:none}} 
@media (max-width:440px){.wrap{gap:12px}.stat{gap:12px}.card{padding:12px;gap:10px}.f{gap:10px}}</style></head><body> <div class="wrap">   <div class="mapbox"><svg id="map" viewBox="0 0 760 480" preserveAspectRatio="xMidYMid meet"></svg>     <div class="stat"><div><b>17</b><span>countries</span></div><div><b>7</b><span>regions</span></div><div><b>60+</b><span>interviews</span></div></div>   </div>   <div class="side"><div class="card" id="card" aria-live="polite"></div></div> </div> <script> const R=[  {n:"North America",roles:"Care agents, ops leads",tools:"Salesforce, carrier portals",pain:"Three return methods, three different flows.",iv:12,c:"#0672CB",ids:[840,124],pins:[[-98,39],[-106,56]],cs:"USA, Canada",carrier:"Manual portals",refund:"At warehouse receipt",time:"1–2 weeks",note:"Most return methods in one market: pickup, drop-off and online. The as-is returns-methods blueprint was mapped here."},  {n:"Latin America",roles:"Care agents, logistics",tools:"Email, carrier portals",pain:"Carrier booking by email adds days per request.",iv:8,c:"#2E7DDB",ids:[76,484],pins:[[-51,-10],[-102,23]],cs:"Brazil, Mexico",carrier:"Email to carriers",refund:"At warehouse receipt",time:"2–4 weeks",note:"Longest timelines in the study. Agents chased carriers by email and customers chased agents."},  {n:"UK & Ireland",roles:"Care agents, finance",tools:"Salesforce, carrier portal",pain:"Every pickup refund confirmed by hand.",iv:6,c:"#7DB9EA",ids:[826,372],pins:[[-2,53.5],[-8,53.2]],cs:"United Kingdom, Ireland",carrier:"Manual portals",refund:"At pickup",time:"5–10 days",note:"Refunds started at pickup, which customers liked, but agents confirmed each one by hand."},  {n:"Western Europe",roles:"Care agents, care leads",tools:"Salesforce, SODS, portals",pain:"Policy exceptions differ in every country.",iv:16,c:"#1E8A4C",ids:[250,276,724,380,528],pins:[[2.5,46.5],[10.4,51.2],[-3.7,40.4],[12.5,42.8],[5.3,52.1]],cs:"France, Germany, Spain, Italy, Netherlands",carrier:"Manual portals",refund:"At warehouse receipt",time:"1–3 weeks",note:"Five countries, five sets of policy exceptions. The clearest case for rules instead of processes."},  {n:"India",roles:"Care agents, ARB facility",tools:"Salesforce, facility tracker",pain:"An extra physical check before any refund.",iv:6,c:"#F5A524",ids:[356],pins:[[78.9,21]],cs:"India",carrier:"Manual portals",refund:"At warehouse receipt",time:"1–2 weeks",note:"Returns routed through return facilities in Bangalore and Delhi, adding a physical-verification step."},  {n:"Asia Pacific & Japan",roles:"Care agents, ops leads",tools:"Email, Salesforce",pain:"Every status update typed by an agent.",iv:9,c:"#C62828",ids:[392,156,702],pins:[[138,36.5],[104,35],[103.8,1.35]],cs:"Japan, China, Singapore",carrier:"Email to carriers",refund:"At warehouse receipt",time:"1–3 weeks",note:"High expectations for status updates, but every update was sent manually by an agent."},  {n:"Australia & New Zealand",roles:"Care agents, carrier partner",tools:"Salesforce, carrier API",pain:"The only region where pickup is booked automatically.",iv:5,c:"#7C3AED",ids:[36,554],pins:[[134,-25],[172.5,-41.5]],cs:"Australia, New Zealand",carrier:"Automated integration",refund:"At pickup",time:"5–7 days",note:"The only region with automated carrier integration. Its technical readiness made it the proof-of-concept market."} ]; const svg=d3.select('#map'),W=760,H=480; const proj=d3.geoNaturalEarth1().scale(142).translate([W/2+10,H/2+8]); const path=d3.geoPath(proj); const byId={};R.forEach((r,i)=>r.ids.forEach(id=>byId[id]=i)); let sel=6; fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()).then(w=>{   const f=topojson.feature(w,w.objects.countries).features.filter(d=>d.id!=='010');   svg.append('g').selectAll('path').data(f).join('path').attr('d',path).attr('class',d=>byId[+d.id]!==undefined?'land hit':'land').attr('data-r',d=>byId[+d.id]??'').each(function(d){const i=byId[+d.id];if(i!==undefined)this.addEventListener('click',()=>pick(i))});   const g=svg.append('g');   R.forEach((r,i)=>r.pins.forEach(p=>{const [x,y]=proj(p);     g.append('circle').attr('class','pulse').attr('cx',x).attr('cy',y).attr('r',5).attr('stroke',r.c).attr('data-r',i);     g.append('circle').attr('class','pin').attr('cx',x).attr('cy',y).attr('r',5).attr('fill',r.c).attr('data-r',i).style('cursor','pointer').on('click',()=>pick(i));}));   paint(); }); const card=document.getElementById('card'); card.innerHTML=`<div class="ch"><div class="cht"><i id="cdot"></i><h4 id="cname"></h4></div><p id="ccs"></p></div> <div class="facts">  <div class="f"><em>Interviews</em><b class="num" id="fiv"></b></div>  <div class="f"><em>Carrier booking</em><b id="fcar"></b></div>  <div class="f"><em>We spoke to</em><b id="frole"></b></div>  <div class="f"><em>Refund trigger</em><b id="fref"></b></div>  <div class="f"><em>Tools in use</em><b id="ftool"></b></div>  <div class="f"><em>Typical return</em><b id="ftime"></b></div> </div> <div class="insight" id="ins"><em>What we heard</em><strong id="fpain"></strong><p id="fnote"></p></div> <div class="dots" id="dots">${R.map((r,i)=>`<button class="dot" data-i="${i}" aria-label="Show ${r.n}"></button>`).join('')}</div>`; document.getElementById('dots').addEventListener('click',e=>{const b=e.target.closest('.dot');if(b)pick(+b.dataset.i)}); function pick(i){sel=i;paint();hold()} let timer=null;const DWELL=10000,HOLD=30000; function hold(){clearInterval(timer);timer=setTimeout(()=>{pick2((sel+1)%R.length);restart()},HOLD)} function restart(){clearInterval(timer);clearTimeout(timer);timer=setInterval(()=>pick2((sel+1)%R.length),DWELL)} function pick2(i){sel=i;paint()} function swap(){const c=document.getElementById('card');c.classList.add('sw');setTimeout(()=>c.classList.remove('sw'),140)} const hov=document.documentElement; hov.addEventListener('mouseenter',()=>{clearInterval(timer);clearTimeout(timer)}); hov.addEventListener('mouseleave',restart); document.addEventListener('visibilitychange',()=>document.hidden?clearInterval(timer):restart()); restart(); function paint(){   const r=R[sel];   swap();   d3.selectAll('.land').style('fill',function(){const k=this.getAttribute('data-r');if(k==='')return null;return +k===sel?R[k].c:'#C9CFD9'});   d3.selectAll('.pin').attr('r',function(){return +this.getAttribute('data-r')===sel?7:3.5}).style('fill',function(){const i=+this.getAttribute('data-r');return i===sel?R[i].c:'#A1A1AA'});   d3.selectAll('.pulse').style('display',function(){return +this.getAttribute('data-r')===sel?null:'none'});   document.getElementById('cdot').style.background=r.c;   document.getElementById('cname').textContent=r.n;   document.getElementById('ccs').textContent=r.cs;   document.getElementById('fiv').textContent=r.iv;   document.getElementById('frole').textContent=r.roles;document.getElementById('frole').title=r.roles;   document.getElementById('ftool').textContent=r.tools;document.getElementById('ftool').title=r.tools;   document.getElementById('fpain').textContent=r.pain;   document.getElementById('fcar').textContent=r.carrier;   document.getElementById('fref').textContent=r.refund;   document.getElementById('ftime').textContent=r.time;   document.getElementById('fnote').textContent=r.note;   document.getElementById('ins').style.borderLeftColor=r.c;   document.querySelectorAll('.dot').forEach(b=>b.classList.toggle('on',+b.dataset.i===sel)); } paint(); </script> </body></html>
