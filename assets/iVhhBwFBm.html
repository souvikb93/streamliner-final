<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
:root{--ink:#121212;--ink2:#454548;--ink3:#696970;--line:#E9E9EC;--line2:#D9D9DE;--brand:#0672CB}
html,body{width:100%}body{display:block!important}body>div{width:100%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:2px;display:flex;flex-direction:column;gap:14px}
.stage{position:relative;border:1px solid #D4D4D8;border-radius:16px;background:#fff;overflow:hidden;display:grid;grid-template-columns:104px minmax(0,1fr)}
.lanes{border-right:1px solid #D4D4D8;background:#F4F6FA;position:relative}
.rl{position:absolute;left:10px;right:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.03em;line-height:1.2;color:#fff;background:#3B4FD8;border-radius:6px;padding:6px 4px}
.rd{position:absolute;left:8px;right:8px;font-size:8.5px;font-weight:600;color:#696970;line-height:1.15;text-align:right}
.view{position:relative;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
.view::-webkit-scrollbar{height:6px}.view::-webkit-scrollbar-thumb{background:#D4D4D8;border-radius:3px}
.canvas{position:relative}
.div{position:absolute;left:0;right:0;border-top:1px dashed #A1A1AA;height:0}
.col{position:absolute;top:0;bottom:0;width:1px;background:#F0F1F4;z-index:0}
svg.lk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
svg.lk path{fill:none;stroke:#A1A1AA;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke-dasharray:100 100;stroke-dashoffset:100;transition:opacity .2s}
svg.lk path.all{opacity:.55;stroke-dashoffset:0}
svg.lk path.past{opacity:.4;stroke-dashoffset:0}
svg.lk path.hot{opacity:1;stroke-dashoffset:0;stroke:var(--brand);stroke-width:2;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1),opacity .12s linear}
.c{position:absolute;z-index:2;border-radius:7px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;border:1px solid transparent;opacity:.32;transform:translateY(2px);transition:opacity .5s,transform .5s cubic-bezier(.34,1.3,.5,1),box-shadow .5s,border-color .5s}
.c.seen{opacity:.72;transform:none}
.c.full,.c.nb{opacity:1;transform:none}
.c.dim{opacity:.3;transform:none}
.c:hover{border-color:rgba(6,114,203,.6)!important}
.c.on{opacity:1;transform:none;border-color:var(--brand)!important;box-shadow:0 6px 16px rgba(6,114,203,.2);z-index:4}
.c:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.c h5{font-size:9px;font-weight:700;letter-spacing:.02em;padding:4px 7px 3px;color:#fff;line-height:1.1}
.c p{font-size:9.5px;line-height:1.3;padding:4px 7px 6px;background:#fff;color:#121212;height:100%;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note{position:absolute;z-index:6;background:#FDF3C7;border:1px solid #EBD98A;border-radius:6px;padding:5px 7px;font-size:9px;line-height:1.32;color:#5C4A08;opacity:0;pointer-events:none;box-shadow:0 4px 10px rgba(18,18,18,.10);transition:opacity .25s}
.note.on{opacity:1}
.grp{position:absolute;border:1.5px dashed #EC6FA9;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .35s}
.grp.on{opacity:1}
.grp span{position:absolute;top:-9px;left:12px;background:#fff;padding:0 6px;font-size:9px;font-weight:700;color:#D6438A}
.tp{display:flex;align-items:center;gap:14px}
.pp{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:#fff;color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,color .2s}
.pp:hover{border-color:var(--ink3);color:var(--ink)}
.pp:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.prail{flex:1;position:relative;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.prail::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--line)}
.rfill{position:absolute;left:0;height:3px;border-radius:2px;background:var(--brand);opacity:.55}
.knob{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid var(--brand);transform:translateX(-50%);box-shadow:0 1px 3px rgba(18,18,18,.18)}
.prail.off .rfill{opacity:.2}.prail.off .knob{border-color:var(--line2)}
.lab{flex:none;min-width:104px;text-align:right;font-size:11px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
@media (max-width:820px){.stage{grid-template-columns:86px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.view{scroll-behavior:auto}.c{transition:opacity .2s}svg.lk path.hot{transition:opacity .2s}}
</style></head><body>
<div class="wrap">
 <div class="stage" id="stage"><div class="lanes" id="lanes"></div><div class="view" id="view"><div class="canvas" id="cv"><svg class="lk" id="lk"></svg></div></div></div>
 <div class="tp"><button class="pp" id="pp" aria-label="Pause"></button><div class="prail" id="prail"><div class="rfill" id="rfill"></div><div class="knob" id="knob"></div></div><span class="lab" id="lab"></span></div>
</div>
<script>
const D={"SYS": {"sfdc": ["SFDC", "#E2574C"], "ce": ["Create & Edit", "#F2994A"], "vr": ["Verify & Review", "#EC6FA9"], "vru": ["Verify & Review UI", "#D6438A"], "pt": ["Process & Track", "#7E6BD9"], "db": ["P&T Database", "#5B4BBF"], "sods": ["SODS", "#3FA796"], "arg": ["AR Gateway", "#52B788"], "ars": ["AR STORE", "#7DC9A0"], "om": ["OMEGA", "#2F8F7F"], "usr": ["Customer", "#F6C453", "#4A3800"]}, "C": [["u1", "usr", 0, 22, "Customer gets in touch with Dell customer care agent", 70, "Phone · Mail · Chat"], ["f1", "sfdc", 0, 120, "Search for order"], ["f2", "sfdc", 1, 120, "Determine resolution", null, "Return a product · negotiate a price · request a credit"], ["f3", "sfdc", 2, 120, "Case is created"], ["e1", "ce", 2, 188, "Open Credit and Edit canvas in SFDC"], ["v1", "vr", 3, 278, "Validate CRE request", null, "Second layer of verify-and-review API"], ["s1", "sods", 3, 492, "Get order details"], ["e2", "ce", 3, 188, "Search by order number"], ["v2", "vr", 4, 278, "Check policy period", null, "Is the order eligible for credit, return or exchange?"], ["p1", "pt", 4, 348, "Provide CRE history"], ["e3", "ce", 4, 188, "Perform policy validation"], ["v3", "vr", 5, 278, "Entity information is forwarded to C&E", null, "Comes from RIMS / P&T DB"], ["e4", "ce", 5, 188, "Decision: within policy or outside policy"], ["v4", "vr", 6, 278, "Read CRE request C&C topic"], ["e5", "ce", 6, 188, "Raise new CRE request with case ID"], ["v5", "vr", 7, 278, "Get order details"], ["s2", "sods", 7, 492, "Get order details"], ["p2", "pt", 7, 348, "Provide CRE history"], ["v6", "vr", 8, 278, "Get CRE previous history", null, "Business rule engine"], ["v7", "vr", 9, 278, "Price match check · save the sale · partial refund check"], ["v8", "vr", 10, 278, "Approve / reject / manual review"], ["d1", "db", 9, 416, "Rejected request saved in the persistence layer"], ["d2", "db", 10, 416, "Get latest CRE status"], ["u2", "vru", 10, 188, "Manual review — approve, reject or hold", null, "On-hold credits go back to SFDC to restart the cycle"], ["f4", "sfdc", 10, 120, "Send bell notification to SFDC if status is rejected or on hold"], ["p3", "pt", 11, 348, "Read CRE status change from V&R topic", null, "Approved credits are forwarded to P&T after manual review"], ["p4", "pt", 12, 348, "Approved request matched to latest CRE status from DB"], ["p5", "pt", 13, 348, "Get order and line items"], ["s3", "sods", 13, 492, "Get order details"], ["p6", "pt", 14, 348, "Construct credit request payload"], ["p7", "pt", 15, 348, "Send payload to AR services", null, "Via Kafka topic"], ["a1", "arg", 15, 492, "Read CRE request message"], ["a2", "ars", 15, 552, "Provide additional information for enriching"], ["a3", "arg", 16, 492, "Enrich credit payload"], ["a4", "ars", 16, 552, "Credit request stored and forwarded to AR Gateway"], ["a5", "arg", 17, 492, "Send CRE request message to OMEGA"], ["o1", "om", 17, 552, "Processing of credit amount"], ["a6", "arg", 18, 492, "Outbound message forwarded to P&T"], ["p8", "pt", 16, 348, "Read credit process response", null, "Via Kafka topic"], ["p9", "pt", 18, 348, "Credit is processed or not processed"], ["d3", "db", 18, 416, "Request saved in the database"], ["f5", "sfdc", 19, 120, "Read notification from P&T", null, "SFDC is notified if the credit is in failed status"], ["f6", "sfdc", 20, 120, "List notifications to care agent"]], "SEQ": ["u1", "f1", "f2", "f3", "e1", "v1", "s1", "e2", "v2", "p1", "e3", "v3", "e4", "v4", "e5", "v5", "s2", "p2", "v6", "v7", "v8", "d1", "d2", "u2", "f4", "p3", "p4", "p5", "s3", "p6", "p7", "a1", "a2", "a3", "a4", "a5", "o1", "a6", "p8", "p9", "d3", "f5", "f6"], "LANES": [["User journey", 8, 96], ["Frontstage actions", 112, 256], ["Backstage actions", 272, 482], ["Support processes", 498, 618]], "DIV": [[104, "Line of interaction"], [264, "Line of visibility"], [490, "Line of internal interaction"]], "W": 132, "CH": 58, "HH": 618, "PITCH": 154, "NCOLS": 21, "CW": 3252, "GRP": ["v5", "v8", "Business rule engine"]};
const {SYS,C,SEQ,LANES,DIV,W,CH,HH,CW,PITCH,GRP}=D;
const X=i=>16+i*PITCH;
const $=i=>document.getElementById(i),cv=$('cv'),lk=$('lk'),view=$('view'),stage=$('stage');
cv.style.width=CW+'px';cv.style.height=HH+'px';
lk.setAttribute('viewBox',`0 0 ${CW} ${HH}`);
const M={},IDX={};SEQ.forEach((n,k)=>IDX[n]=k);
let html='';
for(let i=0;i<D.NCOLS;i++)html+=`<div class="col" style="left:${X(i)-11}px"></div>`;
DIV.forEach(d=>html+=`<div class="div" style="top:${d[0]}px"></div>`);
if(GRP)html+=`<div class="grp" id="grp"><span>${GRP[2]}</span></div>`;
C.forEach(c=>{const s=SYS[c[1]],h=c[5]||CH;
 M[c[0]]={x:X(c[2]),y:c[3],w:W,h};
 html+=`<button class="c" id="${c[0]}" style="left:${X(c[2])}px;top:${c[3]}px;width:${W}px;height:${h}px;background:${s[1]};border-color:${s[1]}"><h5 style="color:${s[2]||'#fff'}">${s[0]}</h5><p>${c[4]}</p></button>`;
 if(c[6]){const above=c[3]>66;html+=`<div class="note" id="n_${c[0]}" style="left:${X(c[2])-8}px;${above?'bottom:'+(HH-c[3]+8)+'px':'top:'+(c[3]+h+8)+'px'};width:${W+16}px">${c[6]}</div>`}});
cv.insertAdjacentHTML('beforeend',html);
if(GRP){const g=$('grp'),a=M[GRP[0]],b=M[GRP[1]];g.style.cssText+=`left:${a.x-9}px;top:${a.y-13}px;width:${b.x+W-a.x+18}px;height:${a.h+22}px`}
$('lanes').innerHTML=LANES.map(l=>`<div class="rl" data-y="${l[1]+((l[2]-l[1])/2)-20}" style="height:40px">${l[0]}</div>`).join('')
 +DIV.map(d=>`<div class="rd" data-y="${d[0]-10}">${d[1]}</div>`).join('');
function poly(p,r=9){let d=`M${p[0][0]},${p[0][1]}`;
 for(let k=1;k<p.length-1;k++){const a=p[k-1],b=p[k],c=p[k+1],l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),rr=Math.min(r,l1/2,l2/2);
  d+=`L${b[0]-(b[0]-a[0])/l1*rr},${b[1]-(b[1]-a[1])/l1*rr}Q${b[0]},${b[1]} ${b[0]+(c[0]-b[0])/l2*rr},${b[1]+(c[1]-b[1])/l2*rr}`}
 return d+`L${p[p.length-1][0]},${p[p.length-1][1]}`}
function path(a,b){const A=M[a],B=M[b];
 const ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;
 let sx,sy,ex,ey;
 if(Math.abs(bx-ax)>8){sx=bx>ax?A.x+A.w:A.x;sy=ay;ex=bx>ax?B.x:B.x+B.w;ey=by}
 else{sx=ax;sy=by>ay?A.y+A.h:A.y;ex=bx;ey=by>ay?B.y:B.y+B.h;return `M${sx},${sy}V${ey}`}
 if(Math.abs(by-ay)<4)return `M${sx},${sy}H${ex}`;
 const mx=(sx+ex)/2,r=Math.min(9,Math.abs(ex-sx)/2,Math.abs(ey-sy)/2),d=ex>sx?1:-1,v=ey>sy?1:-1;
 return `M${sx},${sy}H${mx-d*r}Q${mx},${sy} ${mx+d*r*0},${sy+v*r}V${ey-v*r}Q${mx},${ey} ${mx+d*r},${ey}H${ex}`}
const RAW=D.EDGES||SEQ.slice(1).map((n,i)=>[SEQ[i],n]);
const E=RAW.map(e=>{let [a,b,pts]=e;if(IDX[a]>IDX[b]){[a,b]=[b,a];if(pts)pts=pts.slice().reverse()}
 return {a,b,d:pts?poly(pts):path(a,b)}});
lk.innerHTML=E.map(e=>`<path pathLength="100" d="${e.d}"/>`).join('');
const P=[...lk.querySelectorAll('path')];
const PLAY='<svg width="11" height="12" viewBox="0 0 11 12" fill="currentColor"><path d="M1 1.2v9.6a.6.6 0 0 0 .92.5l7.6-4.8a.6.6 0 0 0 0-1L1.92.7A.6.6 0 0 0 1 1.2z"/></svg>';
const PAUSE='<svg width="10" height="12" viewBox="0 0 10 12" fill="currentColor"><rect x="0" y="0" width="3.2" height="12" rx="1"/><rect x="6.8" y="0" width="3.2" height="12" rx="1"/></svg>';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=SEQ.length;
let mode='play',i=0,sel=null,t=null,dragging=false;
function fitScale(){return Math.min(1,(view.clientWidth-4)/CW)}
function render(){
 const fitMode=mode==='all'||mode==='select',s=fitMode?fitScale():1;
 cv.style.transformOrigin='0 0';cv.style.transform=`scale(${s})`;
 stage.style.height=(HH*s+12)+'px';
 document.querySelectorAll('#lanes [data-y]').forEach(e=>{e.style.top=(+e.dataset.y*s+(e.classList.contains('rl')?-20*(1-s):0))+'px'});
 SEQ.forEach((n,k)=>{const e=$(n);
  e.classList.remove('on','seen','full','nb','dim');
  if(mode==='all')e.classList.add('full');
  else if(mode==='select'){const nb=E.some(x=>(x.a===sel&&x.b===n)||(x.b===sel&&x.a===n));
   e.classList.add(n===sel?'on':nb?'nb':'dim')}
  else{if(k===i)e.classList.add('on');else if(k<i)e.classList.add('seen')}
  const nt=document.getElementById('n_'+n);
  if(nt)nt.classList.toggle('on',mode==='select'?n===sel:(mode!=='all'&&k===i))});
 E.forEach((e,k)=>{const p=P[k];let c='';
  if(mode==='all')c='all';
  else if(mode==='select')c=(e.a===sel||e.b===sel)?'hot':'all';
  else{const ia=IDX[e.a],ib=IDX[e.b];
   if(ib===i)c='hot';else if(ib<i)c='past'}
  p.setAttribute('class',c);
  if(mode==='select'&&c==='all')p.style.opacity='.25';else p.style.opacity=''});
 if(GRP){const a=IDX[GRP[0]],b=IDX[GRP[1]];$('grp').classList.toggle('on',fitMode||(i>=a&&i<=b))}
 $('pp').innerHTML=mode==='play'?PAUSE:PLAY;$('pp').setAttribute('aria-label',mode==='play'?'Pause':'Play');
 const rb=$('prail').getBoundingClientRect().width,f=mode==='all'?1:(N>1?i/(N-1):0);
 $('rfill').style.width=rb*f+'px';$('knob').style.left=rb*f+'px';$('prail').classList.toggle('off',mode==='all');
 $('lab').textContent=mode==='all'?'Full blueprint':`Step ${i+1} of ${N}`;
 view.style.overflowX=fitMode?'hidden':'auto';
 if(fitMode)view.scrollLeft=0;
 else{const m=M[SEQ[i]],want=m.x+m.w/2-view.clientWidth/2;view.scrollLeft=Math.max(0,Math.min(CW-view.clientWidth,want))}}
function tick(){i=(i+1)%N;render();t=setTimeout(tick,i===0?2800:2200)}
function play(){clearTimeout(t);mode='play';sel=null;render();t=setTimeout(tick,reduce?800:1400)}
function pause(){clearTimeout(t);mode='all';sel=null;render()}
$('pp').addEventListener('click',()=>{mode==='play'?pause():play()});
cv.addEventListener('click',e=>{const b=e.target.closest('.c');
 if(!b){if(mode==='select'){mode='all';sel=null;render()}return}
 const k=IDX[b.id];if(k===undefined)return;
 clearTimeout(t);mode='select';sel=b.id;i=k;render()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='select'){mode='all';sel=null;render()}});
function scrub(x){const r=$('prail').getBoundingClientRect();clearTimeout(t);
 i=Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*(N-1));mode='step';sel=null;render()}
$('prail').addEventListener('pointerdown',e=>{dragging=true;$('prail').setPointerCapture(e.pointerId);scrub(e.clientX)});
$('prail').addEventListener('pointermove',e=>{if(dragging)scrub(e.clientX)});
$('prail').addEventListener('pointerup',e=>{dragging=false;$('prail').releasePointerCapture(e.pointerId)});
addEventListener('resize',render);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(t);else if(mode==='play')play()});
render();play();
</script></body></html>
