<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}

html,body{width:100%}body{display:block!important}body>div{width:100%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased}
.wrap{padding:4px}
.stage{background:#fff;border:1px solid #E5E5E5;border-radius:20px;padding:22px 24px;position:relative;display:flex;flex-direction:column}
svg.lk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
svg.lk path{fill:none;stroke:#0672CB;stroke-width:1.75;stroke-linecap:round;opacity:0;stroke-dasharray:100 100;stroke-dashoffset:100}
svg.lk path.hot{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1),opacity .15s linear}
.band{display:flex;align-items:baseline;gap:10px;position:relative;z-index:1;margin-bottom:12px}
.band em{font-style:normal;font-size:12px;font-weight:600;letter-spacing:.01em;color:#696970;background:#fff;padding-right:8px;white-space:nowrap}
.band hr{flex:1;border:0;border-top:1px solid #E5E5E5}
.row{display:grid;gap:14px;position:relative;z-index:1}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gap{height:70px}
.c{font:inherit;text-align:left;background:#fff;border:1px solid #E5E5E5;border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1;transform-origin:50% 50%;transition:border-color .3s,box-shadow .3s,opacity .35s,background .3s,color .3s,transform .35s cubic-bezier(.34,1.3,.5,1)}
.c:focus-visible{outline:2px solid #0672CB;outline-offset:2px}
.c em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.01em;color:#0063B8;margin-bottom:6px;transition:color .3s}
.c b{font-weight:600;letter-spacing:-.01em;color:#121212;transition:color .3s}
.c small{color:#696970;transition:color .3s}
.dim{opacity:.34}
.c.on{border-color:#0672CB;box-shadow:0 0 0 1px #0672CB,0 8px 20px rgba(6,114,203,.12);z-index:3}
.f b{font-size:13.5px;line-height:1.3;margin-bottom:5px}
.f small{font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.i b{font-size:15px;line-height:1.3;margin-bottom:9px}
.i ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.i li{font-size:12px;line-height:1.45;color:#454548;padding-left:14px;position:relative}
.i li::before{content:"";position:absolute;left:1px;top:6px;width:5px;height:5px;border-radius:50%;background:#C8E3F7;transition:background .3s}
.i.on li::before{background:#0672CB}
.i.on{transform:scale(1.045)}
.i.pop{animation:pop .5s cubic-bezier(.34,1.3,.5,1)}
@keyframes pop{0%{transform:scale(1)}55%{transform:scale(1.1)}100%{transform:scale(1.045)}}
.o{border-color:#C8E3F7;background:#fff}
.o b{font-size:15.5px;line-height:1.3;margin-bottom:6px}
.o small{font-size:12px;line-height:1.45}
.o.on{background:#0672CB;border-color:#0672CB;box-shadow:0 8px 20px rgba(6,114,203,.22)}
.o.on em{color:#C8E3F7}.o.on b{color:#fff}.o.on small{color:#F2F8FD}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.i.on,.i.pop{transform:none;animation:none}svg.lk path.hot{transition:opacity .2s linear}}
@media (min-width:900px){body{min-height:612px}}
@media (max-width:820px){.r4,.r3{grid-template-columns:1fr}.gap{height:16px}svg.lk{display:none}.dim{opacity:1}.i.on,.i.pop{transform:none;animation:none}}
@media (max-width:760px){.band em{white-space:normal}}
@media (max-width:440px){.stage{padding:14px}.row{gap:10px}.c{padding:12px 12px}}
</style></head><body>
<div class="wrap"><div class="stage" id="st">
 <svg class="lk" id="lk"></svg>
 <div class="band"><em>Findings &middot; what we observed</em><hr></div>
 <div class="row r4" id="F"></div>
 <div class="gap"></div>
 <div class="band"><em>Insights &middot; what it means</em><hr></div>
 <div class="row r3" id="I"></div>
 <div class="gap"></div>
 <div class="band"><em>Opportunity areas &middot; where design can act</em><hr></div>
 <div class="row r3" id="O"></div>
</div>
</div>
<script>
const F=[['F01','Manual carrier booking','Agents re-typed order data into carrier tools.'],
['F02','Unpredictable timelines','Customers could not tell when a pickup or credit would happen.'],
['F03','Inconsistent refund triggers','Refunds started at different points, often decided case by case.'],
['F04','No real-time visibility','Status lived across emails and tools, so everyone chased updates.']];
const I=[['Insight 01','Autonomy is systemically constrained',['Customers can’t start or edit a request','Agents wait on finance for routine steps'],[0,2]],
['Insight 02','Systems add load instead of support',['Data re-entered across 5+ tools','Policy and eligibility checked from memory'],[0,3]],
['Insight 03','Low transparency undermines trust',['No single status for a case','Timelines and triggers vary by region'],[1,3]]];
const O=[['Opportunity 01','Enable greater autonomy','How might we let people move a request forward without waiting on others?'],
['Opportunity 02','Augment human decision-making','How might we bring the right data and rules to the moment of decision?'],
['Opportunity 03','Clear, predictable communication','How might we make every step, timeline and trigger visible up front?']];
const $=i=>document.getElementById(i);
$('F').innerHTML=F.map((f,k)=>`<button class="c f" data-n="f${k}"><em>${f[0]}</em><b>${f[1]}</b><small>${f[2]}</small></button>`).join('');
$('I').innerHTML=I.map((x,k)=>`<button class="c i" data-n="i${k}"><em>${x[0]}</em><b>${x[1]}</b><ul>${x[2].map(l=>`<li>${l}</li>`).join('')}</ul></button>`).join('');
$('O').innerHTML=O.map((o,k)=>`<button class="c o" data-n="o${k}"><em>${o[0]}</em><b>${o[1]}</b><small>${o[2]}</small></button>`).join('');
const st=$('st'),lk=$('lk'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const L=[];I.forEach((x,k)=>x[3].forEach(f=>L.push({a:'f'+f,b:'i'+k})));I.forEach((x,k)=>L.push({a:'i'+k,b:'o'+k}));
const li=(a,b)=>L.findIndex(l=>l.a===a&&l.b===b);
const el=n=>st.querySelector(`[data-n="${n}"]`);
function curve(x1,y1,x2,y2,m){if(Math.abs(x1-x2)<2)return `M${x1},${y1}V${y2}`;
 const r=Math.min(12,Math.abs(x2-x1)/2,Math.max(2,m-y1),Math.max(2,y2-m)),s=x2>x1?1:-1;
 return `M${x1},${y1}V${m-r}Q${x1},${m} ${x1+s*r},${m}H${x2-s*r}Q${x2},${m} ${x2},${m+r}V${y2}`}
function draw(){const R=st.getBoundingClientRect();lk.setAttribute('viewBox',`0 0 ${R.width} ${R.height}`);
 const inc={};L.forEach(l=>{inc[l.b]=(inc[l.b]||0)+1});const used={};
 lk.innerHTML=L.map((l,n)=>{const a=el(l.a).getBoundingClientRect(),b=el(l.b).getBoundingClientRect();
  const c=inc[l.b],u=used[l.b]=(used[l.b]||0)+1;
  const x1=a.left-R.left+a.width/2;let x2=b.left-R.left+b.width*(u/(c+1));
  if(Math.abs(x1-x2)<20)x2=x1;
  const y1=a.bottom-R.top,y2=b.top-R.top,m=y1+26;
  return `<path data-n="${n}" pathLength="100" d="${curve(x1,y1,x2,y2,m)}"/>`}).join('');
 render()}
function chain(k){const n=new Set(['i'+k,'o'+k]);I[k][3].forEach(f=>n.add('f'+f));return n}
function plan(k){const s=[];I[k][3].forEach(f=>{s.push({card:'f'+f});s.push({link:li('f'+f,'i'+k)})});
 s.push({card:'i'+k,pop:1});s.push({link:li('i'+k,'o'+k)});s.push({card:'o'+k});return s}
let k=0,steps=plan(0),si=0,onC=new Set(),onL=new Set(),scope=chain(0),paused=false,held=false,t=null;
function render(){st.querySelectorAll('.c').forEach(e=>{const n=e.dataset.n;
  e.classList.toggle('on',onC.has(n));e.classList.toggle('dim',!scope.has(n))});
 lk.querySelectorAll('path').forEach(p=>p.classList.toggle('hot',onL.has(+p.dataset.n)))}
function pop(n){if(reduce)return;const e=el(n);e.classList.remove('pop');e.offsetWidth;e.classList.add('pop')}
const CARD=560,LINK=680,END=2400;
function tick(){if(si>=steps.length){t=setTimeout(()=>{k=(k+1)%3;cycle(k)},END);return}
 const s=steps[si++];
 if(s.card){onC.add(s.card);render();if(s.pop)pop(s.card)}else{onL.add(s.link);render()}
 t=setTimeout(tick,s.link!==undefined?LINK:CARD)}
function cycle(n){clearTimeout(t);k=n;steps=plan(n);si=0;onC=new Set();onL=new Set();scope=chain(n);held=false;render();
 t=setTimeout(tick,360)}
function full(n){clearTimeout(t);const ks=n[0]==='f'?I.map((x,j)=>x[3].includes(+n.slice(1))?j:-1).filter(j=>j>=0):[+n.slice(1)];
 scope=new Set([n]);onC=new Set([n]);onL=new Set();
 ks.forEach(j=>{chain(j).forEach(v=>scope.add(v));onC.add('i'+j);onC.add('o'+j);onL.add(li('i'+j,'o'+j));
  if(n[0]==='f'){onL.add(li(n,'i'+j))}else{I[j][3].forEach(f=>{onC.add('f'+f);onL.add(li('f'+f,'i'+j))})}});
 held=true;render();if(n[0]!=='o')pop(n[0]==='i'?n:'i'+ks[0]);
 t=setTimeout(()=>cycle((ks[ks.length-1]+1)%3),20000)}
st.addEventListener('click',e=>{const b=e.target.closest('.c');if(b)full(b.dataset.n)});
const root=document.documentElement;
root.addEventListener('mouseenter',()=>{paused=true;clearTimeout(t);render()});
root.addEventListener('mouseleave',()=>{paused=false;if(!held)tick()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(t);else if(!paused&&!held)tick()});
draw();addEventListener('resize',draw);if(document.fonts)document.fonts.ready.then(draw);cycle(0);
</script></body></html>
