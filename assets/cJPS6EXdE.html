<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
 html,body{width:100%}body{display:block!important}body>div{width:100%} *{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased} .label{font-size:12px;font-weight:600;letter-spacing:.02em;color:#696970}  .wrap{padding:0;display:flex;flex-direction:column} .map{border:1px solid #D4D4D8;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:140px repeat(5,minmax(0,1fr));background:#fff} .c{padding:12px 14px;border-right:1px solid #E5E5E5;border-top:1px solid #E5E5E5;display:flex;flex-direction:column;gap:8px;min-width:0} .c.last{border-right:0} .alt{background:#fff} .rl{flex-direction:row;align-items:center;gap:8px;padding:12px 14px;background:#F4F6FA;border-right:1px solid #D4D4D8;font-size:12px;font-weight:600;color:#121212} .rl.alt{background:#F4F6FA!important} .rl svg{width:15px;height:15px;flex:none;color:#696970} .hd{border-top:0;background:#E3F0FA;flex-direction:row;align-items:center;gap:8px;padding:12px 14px;position:relative;border-right-color:#C8E3F7} .hd.corner{background:#F4F6FA;border-right:1px solid #D4D4D8} .hd .num{width:22px;height:22px;border-radius:50%;background:#0672CB;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none} .hd b{font-size:12px;font-weight:600;line-height:1.3;color:#121212} .hd:not(.last):not(.corner)::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:#E3F0FA;border-top:1px solid #C8E3F7;border-right:1px solid #C8E3F7;transform:translateY(-50%) rotate(45deg);z-index:2} .card{font:inherit;text-align:left;cursor:pointer;background:#fff;border:1px solid #E5E5E5;border-radius:8px;padding:5px 9px;font-size:12px;line-height:1.35;color:#121212;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .2s,box-shadow .2s} .card:hover,.card:focus-visible{border-color:#0672CB;box-shadow:0 0 0 1px #0672CB;outline:none} .q{background:#FFF9EE;border-color:#F5C97A;color:#454548} .o{background:#F2F8FD;border-color:#C8E3F7;color:#0063B8;font-weight:500} .tps{display:flex;flex-wrap:wrap;gap:6px} .tp{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;background:#fff;border:1px solid #E5E5E5;font-size:11px;font-weight:500;color:#454548} .tp svg{width:12px;height:12px;flex:none;color:#0672CB} .feel{grid-column:2/7;border-top:1px solid #E5E5E5;position:relative;height:74px;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),#E5E5E5 calc(20% - 1px) 20%),#fff} .feel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible} .own{flex-direction:row;align-items:center;gap:8px;cursor:pointer} .av{width:24px;height:24px;border-radius:50%;background:#C8E3F7;color:#0063B8;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none} .own span{display:flex;flex-direction:column;min-width:0;font-size:11.5px;line-height:1.3} .own span b,.own span small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .own span small{font-size:11px;color:#696970} .own span b{color:#121212;font-weight:600} .scrim{position:fixed;inset:0;background:rgba(18,18,18,.45);display:none;align-items:center;justify-content:center;z-index:5;padding:16px} .scrim.on{display:flex} .dlg:focus{outline:none} .dlg{background:#fff;border-radius:20px;padding:28px;width:min(440px,100%);display:flex;flex-direction:column;position:relative;box-shadow:0 24px 48px rgba(18,18,18,.22);animation:pop .2s ease-out} @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}} .dh{display:flex;align-items:center;gap:8px;padding-right:48px;min-height:28px} .tag{font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 8px;border-radius:6px;background:#F0F1F4;color:#454548} .tag.q{background:#FFF1DB;color:#A15C00}.tag.o{background:#C8E3F7;color:#0063B8}.tag.fg{background:#D6F2E1;color:#1E8A4C}.tag.fr{background:#FBDADA;color:#C62828} .phs{font-size:12px;font-weight:500;color:#696970} .dlg h4{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em;color:#121212;margin-top:16px} .dlg p{font-size:15px;line-height:1.6;color:#454548;margin-top:8px} .x{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:999px;border:1px solid #E5E5E5;background:#fff;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s} .x:hover{background:#F4F6FA;border-color:#D4D4D8}.x:focus-visible{outline:2px solid #0672CB;outline-offset:2px} .x svg{width:16px;height:16px} @media (prefers-reduced-motion:reduce){.dlg{animation:none}} @media (max-width:1150px){.map{grid-template-columns:120px repeat(5,minmax(0,1fr))}.c{padding:12px 10px}.rl{padding:12px 10px}.card{padding:5px 8px;font-size:11.5px}}

@media (max-width:440px){.c{padding:10px 10px}.rl{padding:10px 10px}.hd{padding:10px 10px}.scrim{padding:12px}.dlg{padding:16px}}

</style></head><body> <div class="wrap">  <div class="map" id="map"></div> </div> <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="dlg" id="dlg" tabindex="-1"><button class="x" id="x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="#454548" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="dh"><span class="tag" id="dg"></span><span class="phs" id="ds"></span></div><h4 id="dt"></h4><p id="db"></p></div></div> <script> const PH=[['Contacts Dell','Customer contacts Dell with the problem'],['Picks incentive or credit','Customer is offered an incentive or credit'],['Verification & case','Case creation: verification and issue capture'],['Request initiated','Credit or product request is initiated'],['Credit received','Credit or product is received']]; const A=[[['Fills contact form','Opens Dell.com and fills the contact form','Customer visits the Dell website to start a return or credit request with the contact form.'],['Calls support','Calls customer support','Customer calls the Dell support line to report the issue to an agent.'],['Chats with an agent','Initiates chat with a support agent','Customer uses live chat on Dell.com to reach an agent.'],['Shares order details','Explains the problem and shares order details','Customer describes the product issue and provides the order number.']], [['Reviews options','Reviews the available options','Customer is shown incentive or credit options and reviews each one.'],['Picks an option','Selects an incentive or credit option','Customer chooses a resolution: refund, credit or product exchange.']], [['Identity verified','Agent verifies identity','The care agent verifies the customer using account details and order history.'],['Shares details','Provides personal and product information','Customer shares the details needed to create the case.'],['Explains issue again','Explains the issue again','Customer describes the full issue so the agent can capture it in the system.']], [['Confirms request','Confirms the credit request','Customer confirms the credit or product request so processing can start.'],['Finance reviews','Transaction details are reviewed','Finance reviews the transaction details before processing the credit.']], [['Credit confirmed','Credit processed and confirmed','The credit or replacement is processed and confirmed.'],['Final email','Receives final confirmation','Customer gets an email confirming the resolution.']]]; const T=[['web','chat','call','mail'],['mail','call'],['call','mail'],['mail','portal'],['mail']]; const TN={web:'Web',chat:'Chat',call:'Call',mail:'Email',portal:'Portal'}; const TI={web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',call:'<path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',portal:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'}; const Q=[[['Such a waste of time','Such a waste of time.','Contacting support for an issue that should not have happened feels like wasted time.'],['Will support fix this?','Is support going to resolve my issue?','Unsure whether support will fix the problem or just add delays.'],['Hope for no delays','Hope they don\'t delay the process.','Worried the process will drag on.']], [['Is this worth it?','Is this compensation worth it?','Weighing whether the incentive or credit is fair.'],['Will it be smooth?','Will this process be smooth?','Hoping it is simple and needs no more effort.'],['What happens next?','What happens next?','Wants clarity on what follows the choice.']], [['Why repeat myself?','Why do I need to repeat information?','Frustrated at giving details already shared earlier.'],['Just resolve it','I just want this resolved quickly.','Stressed and wants the case closed.']], [['When is my credit?','When will I get my credit?','Anxious about the timeline and starts checking their account.'],['Was it done right?','Is everything submitted correctly?','Unsure whether the request was processed right or needs more action.']], [['Finally resolved','Finally resolved.','Relieved that the credit has come through.'],['Never again, I hope','Hope I don\'t need to go through this again.','Reflecting on the effort and hoping it was a one-off.']]]; const FE=[['Frustrated',.35,'Long queues and repeated explanations add to the frustration of dealing with a product issue.'],['Neutral',.55,'Cautiously neutral, waiting to see if the options are fair and the process is simple.'],['Stressed',.12,'Repeating information and not knowing if the case will be right creates stress.'],['Anxious',.25,'Anxious about when the credit will arrive and whether everything was processed.'],['Relieved',.88,'Relieved the issue is resolved and the credit or product is confirmed.']]; const OW=[[0,3,'MY','Michelle Yeoh','Care Agent','Handles first contact, presents the options, and runs verification and case creation in phases 1 to 3.'],[3,1,'SR','Steve Ryder','Finance Manager','Owns the credit request once it is initiated and reviews the transaction details.'],[4,1,'NC','Nicole Coombs','Finance','Confirms the final credit or product delivery and the customer confirmation.']]; const OP=[[['Self-service options','Provide self-service options','Let customers start returns and credit requests online without contacting an agent.'],['Clearer guidance','Offer clearer guidance','Step-by-step guidance on Dell.com so customers know what to do.'],['Less agent reliance','Reduce dependency on agents','Fewer issues need a live agent to move forward.']], [['Clearer options','Improve communication clarity','Make options clear so customers choose the right resolution confidently.'],['Set expectations','Set clear expectations','Tell customers exactly what happens after they choose.'],['Simpler decision','Simplify the decision','Fewer, clearer choices.']], [['No repeat data entry','Reduce repetitive data entry','Pre-fill known fields so customers never repeat themselves.'],['Auto verification','Automate verification','Automated identity and eligibility checks speed up this step.'],['Connected systems','Improve system integration','Connect CRM and order systems so agents have full context.']], [['Live status tracking','Real-time status tracking','Let customers follow the request live in the portal or by email.'],['Proactive updates','Improve transparency','Send proactive updates so nobody is left wondering.'],['Less manual work','Reduce manual processing','Automate more of finance processing to cut turnaround time.']], [['Capture feedback','Capture feedback','A short post-resolution survey to learn and improve.'],['Faster resolution','Reduce resolution time','Find and remove bottlenecks across the journey.']]]; const RI={act:'<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',tp:'<path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',th:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',fe:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',ow:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',op:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'}; const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${RI[k]}</svg>`; const esc=s=>s.replace(/"/g,'&quot;'); const cardB=(cls,x,sub)=>`<button class="card ${cls}" title="${esc(x[1])}" data-c="${cls}" data-s="${sub}" data-t="${esc(x[1])}" data-b="${esc(x[2])}">${x[0]}</button>`; const cells=(arr,alt,fn)=>arr.map((c,i)=>`<div class="c${alt?' alt':''}${i===4?' last':''}">${fn(c,i)}</div>`).join(''); const label=(k,t,alt)=>`<div class="c rl${alt?' alt':''}">${ic(k)}${t}</div>`; let h='<div class="c hd corner"></div>'+PH.map((p,i)=>`<div class="c hd${i===4?' last':''}" title="${esc(p[1])}"><span class="num">${i+1}</span><b>${p[0]}</b></div>`).join(''); h+=label('act','Actions',0)+cells(A,0,(c,i)=>c.map(x=>cardB('',x,i+'|Action')).join('')); h+=label('tp','Touchpoints',1)+cells(T,1,c=>`<div class="tps">${c.map(k=>`<span class="tp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${TI[k]}</svg>${TN[k]}</span>`).join('')}</div>`); h+=label('th','Thoughts',0)+cells(Q,0,(c,i)=>c.map(x=>cardB('q',['“'+x[0]+'”',x[1],x[2]],i+'|Thought')).join('')); h+=label('fe','Feeling',1)+'<div class="feel" id="feel"><svg id="fs"></svg></div>'; h+=label('ow','Owner',0)+OW.map((o,i)=>`<div class="c own${i===2?' last':''}" data-i="${i}" style="grid-column:span ${o[1]}"><div class="av">${o[2]}</div><span><b>${o[3]}</b><small>${o[4]}</small></span></div>`).join(''); h+=label('op','Opportunities',1)+cells(OP,1,(c,i)=>c.map(x=>cardB('o',x,i+'|Opportunity')).join('')); const m=document.getElementById('map');m.innerHTML=h; function drawFeel(){const f=document.getElementById('feel'),s=document.getElementById('fs');const W=f.clientWidth,H=f.clientHeight;s.setAttribute('viewBox',`0 0 ${W} ${H}`);  const cw=W/5,pts=FE.map((e,i)=>[i*cw+cw/2,12+(1-e[1])*(H-24)]);  let d=`M0,${pts[0][1]} L${pts[0][0]},${pts[0][1]}`;  for(let i=0;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2;d+=` C${mx},${pts[i][1]} ${mx},${pts[i+1][1]} ${pts[i+1][0]},${pts[i+1][1]}`}  d+=` L${W},${pts[4][1]}`;  const col=v=>v>=.7?'#1E8A4C':v>=.45?'#696970':'#C62828';  s.innerHTML=`<path d="${d}" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 5"/>`+pts.map((p,i)=>`<g class="fp" data-i="${i}" style="cursor:pointer"><circle cx="${p[0]}" cy="${p[1]}" r="12" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${col(FE[i][1])}" stroke="#fff" stroke-width="2"/><text x="${p[0]+10}" y="${p[1]+4}" font-family="Uncut Sans" font-size="11.5" font-weight="600" fill="${col(FE[i][1])}" stroke="#fff" stroke-width="4" paint-order="stroke">${FE[i][0]}</text></g>`).join('');  s.querySelectorAll('.fp').forEach(g=>g.onclick=()=>{const e=FE[+g.dataset.i];open('Feeling',e[1]>=.7?'fg':e[1]>=.45?'':'fr','Phase '+(+g.dataset.i+1)+' · '+PH[+g.dataset.i][0],e[0],e[2])})} const sc=document.getElementById('scrim'); let last=null;function open(k,c,s,t,b){last=document.activeElement;const g=document.getElementById('dg');g.textContent=k;g.className='tag '+(c||'');document.getElementById('ds').textContent=s;document.getElementById('dt').textContent=t;document.getElementById('db').textContent=b;sc.classList.add('on');document.getElementById('dlg').focus()} function close(){sc.classList.remove('on');if(last&&last.focus)last.focus()} m.addEventListener('click',e=>{const c=e.target.closest('.card');if(c){const [pi,k]=c.dataset.s.split('|');return open(k,c.dataset.c,'Phase '+(+pi+1)+' · '+PH[pi][0],c.dataset.t,c.dataset.b)}const o=e.target.closest('.own');if(o){const w=OW[+o.dataset.i];open('Owner','',w[1]>1?'Phases 1–3':'Phase '+(w[0]+1)+' · '+PH[w[0]][0],w[3]+', '+w[4],w[5])}}); sc.addEventListener('click',e=>{if(e.target===sc)close()}); document.getElementById('x').onclick=close; addEventListener('keydown',e=>{if(e.key==='Escape'&&sc.classList.contains('on'))close()}); drawFeel();addEventListener('resize',drawFeel);if(document.fonts)document.fonts.ready.then(drawFeel); </script></body></html>
