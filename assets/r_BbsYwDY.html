<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
html,body{width:100%}body{display:block!important}body>div{width:100%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:#121212;-webkit-font-smoothing:antialiased}
.wrap{padding:0;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px}
.st{min-width:0;display:flex;flex-direction:column;gap:2px}
.st em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.02em;color:#0063B8}
.st b{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.ctl{flex:none;display:flex;gap:2px;background:#F0F1F4;padding:3px;border-radius:999px}
.ctl button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:transparent;height:30px;padding:0 12px;border-radius:999px;color:#454548;cursor:pointer;transition:background .2s,color .2s}
.ctl button:hover{color:#121212}
.ctl button.on{background:#0672CB;color:#fff}
.ctl button:focus-visible{outline:2px solid #0672CB;outline-offset:2px}
.stage{position:relative;border:1px solid #D4D4D8;border-radius:16px;background:#fff;overflow:hidden;display:grid;grid-template-columns:104px minmax(0,1fr)}
.rail{border-right:1px solid #D4D4D8;background:#F4F6FA;position:relative}
.rl{position:absolute;left:10px;right:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.03em;line-height:1.2;color:#fff;background:#3B4FD8;border-radius:6px;padding:6px 4px}
.rd{position:absolute;left:8px;right:8px;font-size:8.5px;font-weight:600;color:#696970;line-height:1.15;text-align:right}
.view{position:relative;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
.view::-webkit-scrollbar{height:6px}.view::-webkit-scrollbar-thumb{background:#D4D4D8;border-radius:3px}
.canvas{position:relative}
.div{position:absolute;left:0;right:0;border-top:1px dashed #A1A1AA;height:0}
.col{position:absolute;top:0;bottom:0;width:1px;background:#F0F1F4}
svg.lk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.lk path{fill:none;stroke:#A1A1AA;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke-dasharray:100 100;stroke-dashoffset:100}
svg.lk path.hot{opacity:1;stroke-dashoffset:0;stroke:#121212;stroke-width:1.8;transition:stroke-dashoffset .45s cubic-bezier(.4,0,.2,1),opacity .12s linear}
svg.lk path.past{opacity:.4;stroke-dashoffset:0;stroke:#A1A1AA}
.c{position:absolute;border-radius:7px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;border:1px solid transparent;opacity:.32;transform:translateY(2px);transition:opacity .3s,transform .3s cubic-bezier(.34,1.3,.5,1),box-shadow .3s}
.c.seen{opacity:.72;transform:none}
.c.on{opacity:1;transform:none scale(1);box-shadow:0 0 0 2px #121212,0 8px 18px rgba(18,18,18,.16);z-index:4}
.c:focus-visible{outline:2px solid #0672CB;outline-offset:2px}
.c h5{font-size:9px;font-weight:700;letter-spacing:.02em;padding:4px 7px 3px;color:#fff;line-height:1.1}
.c p{font-size:9.5px;line-height:1.3;padding:4px 7px 6px;background:#fff;color:#121212;height:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note{position:absolute;z-index:6;background:#FDF3C7;border:1px solid #EBD98A;border-radius:6px;padding:5px 7px;font-size:9px;line-height:1.32;color:#5C4A08;opacity:0;pointer-events:none;box-shadow:0 4px 10px rgba(18,18,18,.10);transition:opacity .25s}
.note.on{opacity:1}
.grp{position:absolute;border:1.5px dashed #EC6FA9;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .35s}
.grp.on{opacity:1}
.grp span{position:absolute;top:-9px;left:12px;background:#fff;padding:0 6px;font-size:9px;font-weight:700;color:#D6438A}
.prog{display:flex;align-items:center;gap:6px;font-size:11px;color:#696970}
.prog .track{flex:1;height:4px;border-radius:999px;background:#F0F1F4;overflow:hidden}
.prog .fill{height:100%;background:#0672CB;width:0;transition:width .4s linear}
.prog b{font-weight:600;color:#454548;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (min-width:900px){body{min-height:700px}}
@media (prefers-reduced-motion:reduce){.view{scroll-behavior:auto}.c{transition:opacity .2s}svg.lk path.hot{transition:opacity .2s}}
@media (max-width:820px){.stage{grid-template-columns:86px minmax(0,1fr)}.bar{flex-direction:column;align-items:flex-start;gap:10px}.ctl{align-self:stretch}}
</style></head><body>
<div class="wrap">
 <div class="bar">
  <div class="st" aria-live="polite"><em id="eb">Streamliner · to-be credit request</em><b id="ti">Service blueprint</b></div>
  <div class="ctl" id="ctl">
   <button data-a="play" class="on">Play</button>
   <button data-a="pause">Pause</button>
   <button data-a="fit">Fit all</button>
  </div>
 </div>
 <div class="stage" id="stage">
  <div class="rail" id="rail"></div>
  <div class="view" id="view"><div class="canvas" id="cv"><svg class="lk" id="lk"></svg></div></div>
 </div>
 <div class="prog"><div class="track"><div class="fill" id="pf"></div></div><b id="pc"></b></div>
</div>
<script>
const SYS={sfdc:['SFDC','#E2574C'],ce:['Create & Edit','#F2994A'],vr:['Verify & Review','#EC6FA9'],
 vru:['Verify & Review UI','#D6438A'],pt:['Process & Track','#7E6BD9'],db:['P&T Database','#5B4BBF'],
 sods:['SODS','#3FA796'],arg:['AR Gateway','#52B788'],ars:['AR STORE','#7DC9A0'],om:['OMEGA','#2F8F7F'],
 usr:['User journey','#F6C453']};
const X=i=>16+i*154, W=132;
const LY={u:22,fa:120,fb:188,ba:278,bb:348,bc:416,sa:492,sb:552};
const C=[
 ['u1','usr',0,LY.u,'Customer gets in touch with Dell customer care agent',186,'Phone · Mail · Chat'],
 ['f1','sfdc',0,LY.fa,'Search for order'],
 ['f2','sfdc',1,LY.fa,'Determine resolution',null,'Return a product · negotiate a price · request a credit'],
 ['f3','sfdc',2,LY.fa,'Case is created'],
 ['e1','ce',2,LY.fb,'Open Credit and Edit canvas in SFDC'],
 ['v1','vr',3,LY.ba,'Validate CRE request',null,'Second layer of verify-and-review API'],
 ['s1','sods',3,LY.sa,'Get order details'],
 ['e2','ce',3,LY.fb,'Search by order number'],
 ['v2','vr',4,LY.ba,'Check policy period',null,'Is the order eligible for credit, return or exchange?'],
 ['p1','pt',4,LY.bb,'Provide CRE history'],
 ['e3','ce',4,LY.fb,'Perform policy validation'],
 ['v3','vr',5,LY.ba,'Entity information is forwarded to C&E',null,'Comes from RIMS / P&T DB'],
 ['e4','ce',5,LY.fb,'Decision: within policy or outside policy'],
 ['v4','vr',6,LY.ba,'Read CRE request C&C topic'],
 ['e5','ce',6,LY.fb,'Raise new CRE request with case ID'],
 ['v5','vr',7,LY.ba,'Get order details'],
 ['s2','sods',7,LY.sa,'Get order details'],
 ['p2','pt',7,LY.bb,'Provide CRE history'],
 ['v6','vr',8,LY.ba,'Get CRE previous history',null,'Business rule engine'],
 ['v7','vr',9,LY.ba,'Price match check · save the sale · partial refund check'],
 ['v8','vr',10,LY.ba,'Approve / reject / manual review'],
 ['d1','db',9,LY.bc,'Rejected request saved in the persistence layer'],
 ['d2','db',10,LY.bc,'Get latest CRE status'],
 ['u2','vru',10,LY.fb,'Manual review — approve, reject or hold',null,'On-hold credits go back to SFDC to restart the cycle'],
 ['f4','sfdc',10,LY.fa,'Send bell notification to SFDC if status is rejected or on hold'],
 ['p3','pt',11,LY.bb,'Read CRE status change from V&R topic',null,'Approved credits are forwarded to P&T after manual review'],
 ['p4','pt',12,LY.bb,'Approved request matched to latest CRE status from DB'],
 ['p5','pt',13,LY.bb,'Get order and line items'],
 ['s3','sods',13,LY.sa,'Get order details'],
 ['p6','pt',14,LY.bb,'Construct credit request payload'],
 ['p7','pt',15,LY.bb,'Send payload to AR services',null,'Via Kafka topic'],
 ['a1','arg',15,LY.sa,'Read CRE request message'],
 ['a2','ars',15,LY.sb,'Provide additional information for enriching'],
 ['a3','arg',16,LY.sa,'Enrich credit payload'],
 ['a4','ars',16,LY.sb,'Credit request stored and forwarded to AR Gateway'],
 ['a5','arg',17,LY.sa,'Send CRE request message to OMEGA'],
 ['o1','om',17,LY.sb,'Processing of credit amount'],
 ['a6','arg',18,LY.sa,'Outbound message forwarded to P&T'],
 ['p8','pt',16,LY.bb,'Read credit process response',null,'Via Kafka topic'],
 ['p9','pt',18,LY.bb,'Credit is processed or not processed'],
 ['d3','db',18,LY.bc,'Request saved in the database'],
 ['f5','sfdc',19,LY.fa,'Read notification from P&T',null,'SFDC is notified if the credit is in failed status'],
 ['f6','sfdc',20,LY.fa,'List notifications to care agent']];
const SEQ=['u1','f1','f2','f3','e1','v1','s1','e2','v2','p1','e3','v3','e4','v4','e5','v5','s2','p2','v6','v7','v8','d1','d2','u2','f4','p3','p4','p5','s3','p6','p7','a1','a2','a3','a4','a5','o1','a6','p8','p9','d3','f5','f6'];
const LANES=[['User journey',8,96],['Frontstage actions',112,256],['Backstage actions',272,482],['Support processes',498,618]];
const DIV=[[104,'Line of interaction'],[264,'Line of visibility'],[490,'Line of internal interaction']];
const CH=58,HH=618,CW=X(20)+W+24;
const $=i=>document.getElementById(i),cv=$('cv'),lk=$('lk'),view=$('view'),rail=$('rail');
cv.style.width=CW+'px';cv.style.height=HH+'px';
$('stage').style.height=(HH+12)+'px';
lk.setAttribute('viewBox',`0 0 ${CW} ${HH}`);
const M={};
let html='';
for(let i=0;i<21;i++)html+=`<div class="col" style="left:${X(i)-11}px"></div>`;
DIV.forEach(d=>html+=`<div class="div" style="top:${d[0]}px"></div>`);
html+=`<div class="grp" id="grp"><span>Business rule engine</span></div>`;
C.forEach(c=>{const s=SYS[c[1]],h=c[5]||CH;
 M[c[0]]={x:X(c[2]),y:c[3],w:W,h};
 html+=`<button class="c" id="${c[0]}" style="left:${X(c[2])}px;top:${c[3]}px;width:${W}px;height:${h}px;background:${s[1]};border-color:${s[1]}"><h5>${s[0]}</h5><p>${c[4]}</p></button>`;
 if(c[6]){const above=c[3]>66;html+=`<div class="note" id="n_${c[0]}" style="left:${X(c[2])-8}px;${above?'bottom:'+(HH-c[3]+8)+'px':'top:'+(c[3]+h+8)+'px'};width:${W+16}px">${c[6]}</div>`}});
cv.insertAdjacentHTML('beforeend',html);
{const g=$('grp'),a=M.v5,b=M.v8;g.style.cssText+=`left:${a.x-9}px;top:${a.y-13}px;width:${b.x+W-a.x+18}px;height:${a.h+22}px`}
rail.innerHTML=LANES.map(l=>`<div class="rl" style="top:${l[1]+((l[2]-l[1])/2)-20}px;height:40px">${l[0]}</div>`).join('')
 +DIV.map(d=>`<div class="rd" style="top:${d[0]-10}px">${d[1]}</div>`).join('');
function path(a,b){const A=M[a],B=M[b];
 const ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;
 let sx,sy,ex,ey;
 if(Math.abs(bx-ax)>8){sx=bx>ax?A.x+A.w:A.x;sy=ay;ex=bx>ax?B.x:B.x+B.w;ey=by}
 else{sx=ax;sy=by>ay?A.y+A.h:A.y;ex=bx;ey=by>ay?B.y:B.y+B.h;return `M${sx},${sy}V${ey}`}
 if(Math.abs(by-ay)<4)return `M${sx},${sy}H${ex}`;
 const mx=(sx+ex)/2,r=Math.min(9,Math.abs(ex-sx)/2,Math.abs(ey-sy)/2),d=ex>sx?1:-1,v=ey>sy?1:-1;
 return `M${sx},${sy}H${mx-d*r}Q${mx},${sy} ${mx},${sy+v*r}V${ey-v*r}Q${mx},${ey} ${mx+d*r},${ey}H${ex}`}
lk.innerHTML=SEQ.slice(1).map((n,i)=>`<path data-i="${i}" pathLength="100" d="${path(SEQ[i],n)}"/>`).join('');
const P=[...lk.querySelectorAll('path')];
let i=0,t=null,playing=true,fit=false;
const el=n=>document.getElementById(n);
function render(){
 SEQ.forEach((n,k)=>{const e=el(n);e.classList.toggle('on',k===i);e.classList.toggle('seen',k<i);
  const nt=document.getElementById('n_'+n);if(nt)nt.classList.toggle('on',k===i)});
 P.forEach((p,k)=>{p.classList.toggle('hot',k===i-1);p.classList.toggle('past',k<i-1)});
 $('grp').classList.toggle('on',i>=SEQ.indexOf('v5')&&i<=SEQ.indexOf('v8'));
 const c=C.find(x=>x[0]===SEQ[i]);
 $('eb').textContent=SYS[c[1]][0];$('ti').textContent=c[4];
 $('pf').style.width=((i+1)/SEQ.length*100)+'%';$('pc').textContent=`Step ${i+1} of ${SEQ.length}`;
 if(!fit){const m=M[SEQ[i]],want=m.x+m.w/2-view.clientWidth/2;
  view.scrollLeft=Math.max(0,Math.min(CW-view.clientWidth,want))}}
function tick(){i=(i+1)%SEQ.length;render();t=setTimeout(tick,i===0?1600:1050)}
function play(){clearTimeout(t);playing=true;mark('play');t=setTimeout(tick,900)}
function pause(){clearTimeout(t);playing=false;mark('pause')}
function mark(a){document.querySelectorAll('#ctl button').forEach(b=>b.classList.toggle('on',b.dataset.a===a))}
function toggleFit(){fit=!fit;const s=fit?Math.min(1,(view.clientWidth-4)/CW):1;
 cv.style.transformOrigin='0 0';cv.style.transform=`scale(${s})`;
 cv.style.height=(fit?HH*s:HH)+'px';$('stage').style.height=((fit?HH*s:HH)+12)+'px';
 if(fit)view.scrollLeft=0;mark(fit?'fit':(playing?'play':'pause'));if(!fit)render()}
$('ctl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 const a=b.dataset.a;if(a==='play'){if(fit)toggleFit();play()}else if(a==='pause')pause();else toggleFit()});
cv.addEventListener('click',e=>{const b=e.target.closest('.c');if(!b)return;
 const k=SEQ.indexOf(b.id);if(k<0)return;pause();i=k;render()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(t);else if(playing)play()});
render();play();
</script></body></html>
